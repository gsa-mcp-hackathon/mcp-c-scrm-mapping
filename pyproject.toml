[project]
name = "usa-spending-cscrm-mcp-server"
version = "0.1.0"
description = "MCP server for C-SCRM agency exposure reporting against the USAspending.gov API, with login.gov authentication."
authors = [{name = "GSA TTS"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp[code-mode]>=3.1.0",
    "httpx>=0.28.1,<0.29",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
usa-spending-mcp-server = "usa_spending_mcp_server.server:main"
usa-spending-mcp-server-http = "usa_spending_mcp_server.server_http:main"
usaspending-cscrm = "usaspending_cscrm_mcp.server_http:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usa_spending_mcp_server", "src/usaspending_cscrm_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["usa_spending_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"